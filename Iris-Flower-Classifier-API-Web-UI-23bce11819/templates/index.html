<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Classifier</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 20%, #2d1b4e, #10071f 70%);
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .icon {
            width: 56px; height: 56px;
            display:flex; align-items:center; justify-content:center;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 16px;
            font-size: 28px;
            margin-bottom: 18px;
        }
        h1 { color: #f5f3ff; font-size: 24px; margin: 0 0 6px; }
        p.sub { color: #c4b5fd; font-size: 13px; margin: 0 0 26px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        label {
            display:block; font-size: 11px; letter-spacing: 0.06em;
            text-transform: uppercase; color: #d8b4fe; margin-bottom: 6px;
        }
        input {
            width: 100%; padding: 11px 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25); color: #fff; font-size: 14px;
            outline: none; transition: border 0.2s, background 0.2s;
        }
        input:focus { border-color: #c084fc; background: rgba(0,0,0,0.4); }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: none; border-radius: 12px; cursor: pointer;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white; font-weight: 600; font-size: 14px;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 24px rgba(168,85,247,0.35);
            transition: transform 0.15s;
        }
        button:hover { transform: translateY(-1px); }
        #resultBox {
            display: none; margin-top: 22px; padding: 16px;
            border-radius: 14px; text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
        }
        #resultBox.ok { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); }
        #resultBox.err { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); }
        #resultText { margin: 0; font-size: 16px; font-weight: 600; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🌸</div>
        <h1>Iris Flower Predictor</h1>
        <p class="sub">Enter the measurements to classify the species.</p>

        <form id="predictionForm">
            <div class="grid">
                <div>
                    <label>Sepal Length (cm)</label>
                    <input type="number" step="0.1" name="sepal_length" required>
                </div>
                <div>
                    <label>Sepal Width (cm)</label>
                    <input type="number" step="0.1" name="sepal_width" required>
                </div>
                <div>
                    <label>Petal Length (cm)</label>
                    <input type="number" step="0.1" name="petal_length" required>
                </div>
                <div>
                    <label>Petal Width (cm)</label>
                    <input type="number" step="0.1" name="petal_width" required>
                </div>
            </div>

            <button type="submit">Classify Flower</button>
        </form>

        <div id="resultBox">
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            const formData = new FormData(e.target);
            const payload = {
                sepal_length: parseFloat(formData.get('sepal_length')),
                sepal_width: parseFloat(formData.get('sepal_width')),
                petal_length: parseFloat(formData.get('petal_length')),
                petal_width: parseFloat(formData.get('petal_width'))
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                resultBox.style.display = 'block';
                resultBox.classList.remove('ok', 'err');

                if (response.ok) {
                    resultBox.classList.add('ok');
                    resultText.innerText = `Prediction: ${data.class}`;
                } else {
                    throw new Error(data.error || 'Server processing error');
                }
            } catch (err) {
                resultBox.style.display = 'block';
                resultBox.classList.add('err');
                resultText.innerText = `Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
